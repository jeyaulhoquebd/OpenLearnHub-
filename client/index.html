<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f4b" />
    <meta
      name="description"
      content="OpenLearn Hub curates legal, free courses, books, and open-source software for learners in Bangladesh, India, and Pakistan."
    />
    <meta property="og:title" content="OpenLearn Hub — Knowledge for Everyone" />
    <meta
      property="og:description"
      content="Learn for free, legally. Curated courses, public-domain and open-licensed books, and official open-source software downloads."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>OpenLearn Hub — Knowledge for Everyone</title>
    <script>
      // Applied before first paint to avoid a flash of the wrong theme/direction.
      (function () {
        try {
          var stored = localStorage.getItem('openlearn.theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');

          var lang = localStorage.getItem('openlearn.language') || 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ur' ? 'rtl' : 'ltr';

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b1220' : '#0b1f4b');
        } catch (error) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
