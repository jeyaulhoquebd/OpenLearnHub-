# Render blueprint for the OpenLearn Hub API.
# Frontend is deployed separately to Firebase Hosting.
services:
  - type: web
    name: openlearn-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_TIMEOUT_MS
        value: "30000"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "700"
      - key: REPORT_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "25"
      - key: GLOBAL_RATE_LIMIT_PER_15_MIN
        value: "400"
