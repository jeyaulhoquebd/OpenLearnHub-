# Render blueprint for the OpenLearn Hub API.
# Frontend is deployed separately to Firebase Hosting.
services:
  - type: web
    name: openlearn-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TIMEOUT_MS
        value: "15000"
      - key: GROQ_MAX_OUTPUT_TOKENS
        value: "1024"
      - key: GROQ_ROADMAP_MAX_OUTPUT_TOKENS
        value: "2048"
      - key: AI_DAILY_LIMIT_PER_USER
        value: "10"
      # AES-256-GCM key for secrets stored in Firestore settings/ai.
      # Generate with: openssl rand -hex 32
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: REPORT_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: AI_RATE_LIMIT_PER_HOUR
        value: "25"
      - key: ROADMAP_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: GLOBAL_RATE_LIMIT_PER_15_MIN
        value: "400"
